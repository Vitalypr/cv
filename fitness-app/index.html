anvas{width:100%;height:100%}.legendGrid{display:grid;gap:10px}.legendCard{display:grid;grid-template-columns:98px 1fr;gap:12px;align-items:center;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:16px;padding:10px}.svgBox{height:90px;background:#07101c;border-radius:14px;border:1px solid rgba(255,255,255,.06);display:grid;place-items:center;overflow:hidden}.svgBox svg{width:94px;height:82px}.steps{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px}.searchRow{display:flex;gap:8px}.searchRow input{flex:1}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{border-bottom:1px solid rgba(255,255,255,.07);padding:9px 6px;text-align:right;vertical-align:top}.table th{color:var(--muted);font-weight:600}.kbd{font-family:ui-monospace,Menlo,monospace;background:#08101b;border:1px solid var(--line);border-radius:8px;padding:2px 6px;color:#d6e8ff}.ok{color:var(--accent2)}.warnText{color:var(--warn)}.dangerText{color:var(--danger)}.toast{position:fixed;left:50%;bottom:calc(var(--tabH) + 20px);transform:translateX(-50%);background:#13233a;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:10px 14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1}.dayPicker{display:flex;gap:8px;overflow:auto;padding:4px 0 8px}.dayChip{border:1px solid var(--line);background:#0f1724;color:var(--muted);border-radius:999px;padding:8px 11px;white-space:nowrap}.dayChip.active{background:rgba(100,210,255,.13);color:var(--accent);border-color:rgba(100,210,255,.4)}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-left:4px}.macroRow{display:grid;grid-template-columns:86px 1fr 52px;gap:8px;align-items:center;margin:9px 0}.macroRow span{font-size:12px;color:var(--muted)}.hidden{display:none!important}.installNote{font-size:12px;color:var(--muted);line-height:1.5}.manualTag{display:inline-block;margin-right:6px;border:1px solid rgba(255,209,102,.35);background:rgba(255,209,102,.11);color:#ffe8ad;border-radius:999px;padding:2px 7px;font-size:11px}.inlineNote{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}.footerSpace{height:30px}.rtlNum{direction:ltr;unicode-bidi:embed}
    .restbar{position:fixed;left:12px;right:12px;bottom:calc(var(--tabH) + 14px);z-index:40;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#13233a,#0f1c30);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}

<body>
  <div class="app">
    <header>
      <h1>תוכנית חיטוב וכוח — 8 שבועות</h1>
      <div class="sub">אפליקציה מקומית לטלפון: אימונים, תזונה, מעקב, גיבוי ושחזור. הנתונים נשמרים רק בדפדפן שלך.</div>
      <div class="pillRow">
        <div class="pill">משקל פתיחה: <strong>77 ק״ג</strong></div>
        <div class="pill">יעד: <strong>72–73 ק״ג</strong></div>
        <div class="pill">חלבון: <strong>150–170 גרם</strong></div>
        <div class="pill">קלוריות: <strong>2,200–2,300</strong></div>
        <div class="pill">אימונים: <strong>5 כוח + קרדיו</strong></div>
      </div>
    </header>

    <main>
      <section id="daily" class="view active" role="tabpanel" aria-label="יומי"></section>
      <section id="weekly" class="view" role="tabpanel" aria-label="שבועי"></section>
      <section id="nutrition" class="view" role="tabpanel" aria-label="תזונה"></section>
      <section id="tracking" class="view" role="tabpanel" aria-label="מעקב"></section>
      <section id="exercises" class="view" role="tabpanel" aria-label="מקרא"></section>
      <section id="settings" class="view" role="tabpanel" aria-label="גיבוי"></section>
    </main>
  </div>

  <nav class="tabs" aria-label="ניווט">
    <div class="tabbar" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" aria-controls="daily" data-view="daily"><span class="ico" aria-hidden="true">🏋️</span><span>יומי</span></button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="weekly" data-view="weekly"><span class="ico" aria-hidden="true">📅</span><span>שבועי</span></button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="nutrition" data-view="nutrition"><span class="ico" aria-hidden="true">🍽️</span><span>תזונה</span></button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="tracking" data-view="tracking"><span class="ico" aria-hidden="true">📈</span><span>מעקב</span></button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="exercises" data-view="exercises"><span class="ico" aria-hidden="true">📚</span><span>מקרא</span></button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="settings" data-view="settings"><span class="ico" aria-hidden="true">⚙️</span><span>גיבוי</span></button>
    </div>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite">נשמר</div>
  <div id="restTimer" class="restbar hidden" role="timer" aria-label="טיימר מנוחה" data-testid="rest-timer">
    <button class="rbtn" id="restMinus" data-testid="rest-minus" aria-label="פחות 15 שניות">−15</button>
    <div class="rwrap"><div class="rlabel">מנוחה</div><div class="rtime" id="restRemaining" data-testid="rest-remaining">01:30</div></div>
    <button class="rbtn" id="restPlus" data-testid="rest-plus" aria-label="עוד 15 שניות">+15</button>
    <button class="rbtn rskip" id="restSkip" data-testid="rest-skip">דלג</button>
  </div>

<script>

  function ensureStateShape(raw){
    raw = isObj(raw) ? raw : {};
    const base = clone(defaultState);
    const merged = Object.assign(base, raw);
    // Coerce containers to safe types so a malformed/corrupt backup can't crash a renderer.
    merged.logs = isObj(raw.logs) ? Object.assign(clone(defaultState.logs), raw.logs) : clone(defaultState.logs);
    merged.logs.workouts = isObj(merged.logs.workouts) ? merged.logs.workouts : {};
    merged.logs.nutrition = isObj(merged.logs.nutrition) ? merged.logs.nutrition : {};
    merged.logs.body = isObj(merged.logs.body) ? merged.logs.body : {};
    merged.logs.performance = isObj(merged.logs.performance) ? merged.logs.performance : {};
    merged.customExercises = isObj(raw.customExercises) ? raw.customExercises : {};
    merged.settings = Object.assign(clone(defaultState.settings), isObj(raw.settings) ? raw.settings : {});
    // Numeric settings must be numbers.
    for(const k of ['calorieTarget','proteinTarget','carbTarget','fatTarget','waterTarget','restDefaultSec']){
      const n = parseFloat(merged.settings[k]); merged.settings[k] = Number.isFinite(n) ? n : defaultState.settings[k];
    }

    const sd = parseInt(merged.selectedDay, 10);
    merged.selectedDay = Number.isInteger(sd) ? Math.min(Math.max(0, sd), plan.days.length-1) : 0;
    return merged;
  }

  function programPosition(){

  // ---- Per-exercise history (across all workout logs), for hints + progressive overload ----
  function allWorkoutSets(){ const out=[]; for(const l of Object.values(state.logs.workouts||{})){ for(const s of (l.sets||[])){ out.push(s); } } return out; }
  function historyFor(ex){ const id=ex.id, name=ex.name; return allWorkoutSets().filter(s=> s.exerciseId ? s.exerciseId===id : s.exercise===name).sort((a,b)=>String(a.date).localeCompare(String(b.date))); }
  // Best (heaviest) set of the most recent session strictly BEFORE today.
  function lastSessionBest(ex){ const h=historyFor(ex).filter(s=>String(s.date)<todayIso()); if(!h.length) return null; const lastDate=h[h.length-1].date; let best=null; for(const s of h){ if(s.date!==lastDate) continue; if(!best || safeNum(s.weight)>safeNum(best.weight) || (safeNum(s.weight)===safeNum(best.weight)&&safeNum(s.reps)>safeNum(best.reps))) best=s; } return best; }

  function drawCharts(){
    const bodyRows=Object.entries(state.logs.body).sort((a,b)=>a[0].localeCompare(b[0]));
    drawLine('weightChart', bodyRows.map(([d,b])=>({x:d,y:safeNum(b.weight)})).filter(p=>p.y), 'משקל');
    drawLine('waistChart', bodyRows.map(([d,b])=>({x:d,y:safeNum(b.waist)})).filter(p=>p.y), 'בטן');
    const dates=[]; for(let i=13;i>=0;i--) dates.push(getDate(-i));
    drawBars('calChart', dates.map(d=>({x:d.slice(5),y:calcNutrition(d).cal})), state.settings.calorieTarget);
  }
  function prepCanvas(id){ const c=document.getElementById(id); if(!c) return null; const rect=c.getBoundingClientRect(); const scale=window.devicePixelRatio||1; c.width=rect.width*scale; c.height=rect.height*scale; const ctx=c.getContext('2d'); ctx.scale(scale,scale); return {c,ctx,w:rect.width,h:rect.height}; }
  function drawLine(id, data, label){
    window.__chartPoints = window.__chartPoints || {};
    const o=prepCanvas(id); if(!o) return; const {ctx,w,h}=o; ctx.clearRect(0,0,w,h);
    ctx.fillStyle='#a9b7cc'; ctx.font='12px Arial';
    if(data.length<2){ window.__chartPoints[id]=[]; ctx.fillText('צריך לפחות שתי מדידות כדי לצייר גרף',16,28); return; }
    const pad=28; const ys=data.map(d=>d.y); let min=Math.min(...ys), max=Math.max(...ys); if(min===max){min-=1;max+=1;}
    // X is positioned by ACTUAL DATE, not array index, so uneven gaps read honestly.
    const ts=data.map(d=>new Date(d.x).getTime()); let tmin=Math.min(...ts), tmax=Math.max(...ts);
    const xAt=(t,i)=> tmax===tmin ? pad+(w-pad*2)*i/(data.length-1) : pad+(w-pad*2)*(t-tmin)/(tmax-tmin);
    ctx.strokeStyle='#27364d'; ctx.lineWidth=1; for(let i=0;i<4;i++){ const y=pad+(h-pad*2)*i/3; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(w-pad,y); ctx.stroke(); }
    const pts=data.map((p,i)=>({ x:xAt(ts[i],i), y:h-pad-(p.y-min)/(max-min)*(h-pad*2), date:p.x, value:p.y }));
    window.__chartPoints[id]=pts;
    ctx.strokeStyle='#64d2ff'; ctx.lineWidth=3; ctx.beginPath(); pts.forEach((p,i)=>{ if(i) ctx.lineTo(p.x,p.y); else ctx.moveTo(p.x,p.y); }); ctx.stroke();
    ctx.fillStyle='#f3f7ff'; ctx.fillText(`${label}: ${data.at(-1).y}`,pad,18);
    ctx.fillStyle='#a9b7cc'; ctx.font='10px Arial';
    ctx.fillText(String(min.toFixed(1)),4,h-pad); ctx.fillText(String(max.toFixed(1)),4,pad+4);
    // First/last date labels so the time axis is legible.
    ctx.fillText(String(data[0].x).slice(5), pad, h-8); const last=String(data.at(-1).x).slice(5); ctx.fillText(last, w-pad-ctx.measureText(last).width, h-8);
  }
  function drawBars(id,data,target){ const o=prepCanvas(id); if(!o) return; const {ctx,w,h}=o; ctx.clearRect(0,0,w,h); const pad=28; const max=Math.max(target, ...data.map(d=>d.y), 1); const bw=(w-pad*2)/data.length*.7; ctx.strokeStyle='#27364d'; ctx.lineWidth=1; ctx.beginPath(); const ty=h-pad-target/max*(h-pad*2); ctx.moveTo(pad,ty); ctx.lineTo(w-pad,ty); ctx.stroke(); ctx.fillStyle='#a9b7cc'; ctx.font='11px Arial'; ctx.fillText('יעד',pad,ty-4); data.forEach((p,i)=>{ const x=pad+(w-pad*2)*i/data.length + bw*.2; const bh=p.y/max*(h-pad*2); const y=h-pad-bh; const g=ctx.createLinearGradient(0,y,0,h-pad); g.addColorStop(0,'#64d2ff'); g.addColorStop(1,'#8fffbd'); ctx.fillStyle=g; ctx.fillRect(x,y,bw,bh); }); ctx.fillStyle='#f3f7ff'; ctx.font='12px Arial'; ctx.fillText('קלוריות ב־14 ימים אחרונים',pad,18); }

      arms:`${common}${head(48,24)}<line class="l" x1="48" y1="31" x2="48" y2="58"/><path class="l g" d="M48 39 Q26 31 24 53"/><path class="l g" d="M48 39 Q70 31 72 53"/><line class="l" x1="48" y1="58" x2="38" y2="77"/><line class="l" x1="48" y1="58" x2="58" y2="77"/>`
    };
    return `<svg viewBox="0 0 96 84" role="img" aria-label="איור ${type}">${map[type]||map.checkin}</svg>`;
  }

  function renderSettings(){
    const root=document.getElementById('settings');
    root.innerHTML=`
      <div class="grid">
        <div class="card"><h2>ארכיטקטורה מקומית פשוטה</h2>
          <p class="muted">האפליקציה היא קובץ HTML יחיד. אין שרת, אין משתמשים, ואין שליחת נתונים החוצה. כל הנתונים נשמרים בדפדפן בטלפון תחת מפתח <span class="kbd">${APP_KEY}</span>.</p>
          <table class="table"><tr><th>שכבה</th><th>תפקיד</th></tr><tr><td>UI</td><td>לשוניות תחתונות, כרטיסים, טפסים מהירים וגרפים.</td></tr><tr><td>Data Model</td><td>אובייקט JSON אחד: אימונים, תזונה, מדדי גוף, ביצועים, תרגילים ידניים והגדרות.</td></tr><tr><td>Storage</td><td>localStorage לשמירה אוטומטית. מתאים לאפליקציה קטנה של משתמש יחיד.</td></tr><tr><td>Backup</td><td>ייצוא JSON לקובץ ושחזור מקובץ JSON.</td></tr><tr><td>Processing</td><td>חישוב מקומי של קלוריות, חלבון, השלמות אימון, תרגילים ידניים וגרפים.</td></tr></table>
          <p class="installNote">שימוש מומלץ בטלפון: לפתוח את הקובץ בדפדפן, ואז “הוסף למסך הבית” אם הדפדפן מאפשר. חשוב לבצע גיבוי JSON מדי שבוע.</p>
        </div>
        <div class="card"><h2>הגדרות יעדים</h2>
          <div class="formGrid two">
            <div><label class="small muted">קלוריות</label><input id="setCal" class="input" type="number" value="${state.settings.calorieTarget}"></div>
            <div><label class="small muted">חלבון g</label><input id="setProtein" class="input" type="number" value="${state.settings.proteinTarget}"></div>
            <div><label class="small muted">פחמימות g</label><input id="setCarb" class="input" type="number" value="${state.settings.carbTarget}"></div>
            <div><label class="small muted">שומן g</label><input id="setFat" class="input" type="number" value="${state.settings.fatTarget}"></div>
            <div><label class="small muted">מנוחה ברירת מחדל (שנ׳)</label><input id="setRest" class="input" type="number" step="5" value="${state.settings.restDefaultSec}"></div>
          </div>
          <button class="btn" id="saveSettings" style="margin-top:10px;width:100%">שמור יעדים</button>
        </div>
        <div class="card"><h2>גיבוי ושחזור</h2>
          <div class="btnRow"><button class="btn" id="exportData">ייצוא גיבוי JSON</button><label class="btn secondary" for="importFile">ייבוא גיבוי</label><input id="importFile" class="hidden" type="file" accept="application/json,.json"><button class="btn danger" id="resetData">איפוס נתונים</button></div>
          <p class="muted small">הייצוא כולל רק את הלוגים וההגדרות שלך, לא שולח כלום לאינטרנט.</p>
        </div>
        <div class="card"><h2>עקרונות עיצוב שנלקחו ממוצרים קיימים</h2>
          <div class="legendGrid">
            <div class="foodItem"><span>לוג אימון מהיר: תרגיל, משקל, חזרות, RPE, היסטוריה וגרפים.</span></div>
            <div class="foodItem"><span>תזונה לא מסובכת: תבניות ארוחה, קלוריות וחלבון במקום מאגר מזון ענק.</span></div>
            <div class="foodItem"><span>מעקב גוף וביצועים באותו מקום: משקל, בטן, צעדים, שינה, מתח/מקבילים/שכיבות סמיכה.</span></div>
            <div class="foodItem"><span>טלפון קודם: לשוניות תחתונות, כפתורים גדולים, מעט הקלדה, סיכום יומי.</span></div>
          </div>
        </div>
        <div class="card"><h2>מגבלות חשובות</h2><p class="muted">localStorage יכול להימחק אם מנקים נתוני אתר/דפדפן. לכן הגיבוי חשוב. אם בעתיד תרצה הרבה תמונות/קבצים או נפח גדול, נכון לעבור ל־IndexedDB.</p></div>
      </div>`;
    root.querySelector('#saveSettings').onclick=()=>{ state.settings.calorieTarget=safeNum(val('setCal')); state.settings.proteinTarget=safeNum(val('setProtein')); state.settings.carbTarget=safeNum(val('setCarb')); state.settings.fatTarget=safeNum(val('setFat')); state.settings.restDefaultSec=safeNum(val('setRest'))||90; saveState(); toast('הגדרות נשמרו'); renderNutrition(); renderTracking(); };
    root.querySelector('#exportData').onclick=()=>{ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`fitness-backup-${todayIso()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
    root.querySelector('#importFile').onchange=(ev)=>{ const file=ev.target.files[0]; if(!file) return; if(file.size>20*1024*1024){ alert('הקובץ גדול מדי'); return; } const r=new FileReader(); r.onerror=()=>alert('שגיאה בקריאת הקובץ'); r.onload=()=>{ try{ const data=JSON.parse(r.result); if(!data || typeof data!=='object' || !('logs' in data)) throw new Error('invalid'); try{ localStorage.setItem(APP_KEY+'_prev', localStorage.getItem(APP_KEY)||JSON.stringify(state)); }catch(e){} state=ensureStateShape(data); saveState(); toast('שוחזר מגיבוי'); render(); }catch(e){ alert('קובץ גיבוי לא תקין'); } }; r.readAsText(file); };
    root.querySelector('#resetData').onclick=()=>{ if(confirm('לאפס את כל הנתונים המקומיים? כדאי לייצא גיבוי קודם.')){ state=clone(defaultState); state.selectedDay=programPosition().dayIndex; saveState(); render(); toast('אופס'); } };
  }

  document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{ document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active'); t.setAttribute('aria-selected','false');}); tab.classList.add('active'); tab.setAttribute('aria-selected','true'); document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById(tab.dataset.view).classList.add('active'); if(tab.dataset.view==='tracking') setTimeout(drawCharts,0); window.scrollTo({top:0,behavior:'smooth'}); });

  // Redraw charts on resize/orientation change (only when the tracking tab is visible).
  let _rsz=null;
  function onResize(){ clearTimeout(_rsz); _rsz=setTimeout(()=>{ if(document.getElementById('tracking')?.classList.contains('active')) drawCharts(); },150); }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  // Rest-timer controls (live in the static body, so re-renders don't disturb the running timer).
  document.getElementById('restMinus').onclick=()=>adjustRest(-15);
  document.getElementById('restPlus').onclick=()=>adjustRest(15);
  document.getElementById('restSkip').onclick=skipRest;

  // Open straight to today's scheduled workout (override still available via the day picker).
  state.selectedDay = programPosition().dayIndex;
  render();
})();
</script>
<script>
// PWA: register the service worker (skip on file:// where SW is unavailable).
(function(){
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline-only is still fine */ });
    });
  }
  // iOS install hint: Safari has no beforeinstallprompt. Show a one-time tip.
  try {
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    if (isIOS && !standalone && !localStorage.getItem('ios_install_hint_dismissed')) {
      const bar = document.createElement('div');
      bar.setAttribute('role','note');
      bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(var(--tabH) + 14px);z-index:60;background:#13233a;border:1px solid #27364d;color:#f3f7ff;border-radius:14px;padding:10px 12px;font:13px -apple-system,Arial;box-shadow:0 10px 30px rgba(0,0,0,.35)';
      bar.innerHTML = 'להתקנה: שתף ▸ הוסף למסך הבית <button id="iosHintX" style="float:left;background:transparent;border:0;color:#64d2ff;font-weight:800">סגור</button>';
      document.body.appendChild(bar);
      bar.querySelector('#iosHintX').onclick = () => { localStorage.setItem('ios_install_hint_dismissed','1'); bar.remove(); };
    }
  } catch (e) { /* noop */ }
})();
</script>
</body>
</html>

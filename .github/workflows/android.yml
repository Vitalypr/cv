name: Build Android APK

# Builds a debug APK you can download from the run's "Artifacts" and sideload.
on:
  push:
    branches: ["claude/training-app-review-ykzrgo"]
    paths:
      - "fitness-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets + sync Capacitor
        run: |
          npm run build:web
          npx cap sync android

      - name: Build debug APK
        working-directory: fitness-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/fitness-app.apk
        working-directory: fitness-app/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitness-app-debug-apk
          path: fitness-app/android/app/build/outputs/apk/debug/fitness-app.apk
          if-no-files-found: error

      - name: Publish APK to a Release (stable direct link)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Fitness app (latest Android build)
          body: |
            Debug-signed APK of the fitness app, built automatically from the latest commit.
            Direct download: fitness-app.apk below. Sideload on Android (enable "install unknown apps").
          files: fitness-app/android/app/build/outputs/apk/debug/fitness-app.apk
          make_latest: true

name: Build Android APK

# Builds a debug APK you can download from the run's "Artifacts" and sideload.
on:
  push:
    branches: ["claude/training-app-review-ykzrgo"]
    paths:
      - "fitness-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets + sync Capacitor
        run: |
          npm run build:web
          npx cap sync android

      - name: Build debug APK
        working-directory: fitness-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-app-debug-apk
          path: fitness-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
